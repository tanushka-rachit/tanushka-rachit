<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cards</title>
<style>
html, body { height: 100%; margin: 0; overflow: hidden; background: #14172b; }
.stack {
  position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(1080px, 100vw, 100dvh - 48px - env(safe-area-inset-top, 0px)); aspect-ratio: 1 / 1;
  cursor: pointer; outline: none;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation;
}
.stack:focus-visible { outline: 4px solid rgba(255,255,255,.8); outline-offset: -8px; }
.card {
  position: absolute; inset: 0; background: var(--c);
  box-shadow: -12px 0 40px rgba(10, 12, 30, .3);
  transition: transform .45s cubic-bezier(.3,.8,.3,1);
  will-change: transform;
}
.card.leaving { transition: transform .3s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .card, .card.leaving { transition-duration: .01s; }
}
</style>
</head>
<body>
<div class="stack" id="stack" role="button" tabindex="0" aria-label="Card stack. Activate to move the top card to the back."></div>

<script>
// Edit this list to change the colors, or add more.
var colors = ["#f5c542", "#7bd3c0", "#ff8fa3", "#8fa9ff", "#f2f2f7", "#ffb36b"];

var stack = document.getElementById("stack");
var order = colors.map(function (_, i) { return i; });
var busy = false;

var els = colors.map(function (c) {
  var el = document.createElement("div");
  el.className = "card";
  el.style.setProperty("--c", c);
  stack.appendChild(el);
  return el;
});

function layout() {
  order.forEach(function (id, pos) {
    var el = els[id];
    el.style.zIndex = colors.length - pos;
    el.style.transform = "none";
  });
}

function next() {
  if (busy) return;
  busy = true;
  var top = els[order[0]];
  top.classList.add("leaving");
  top.style.transform = "translateX(110%) rotate(6deg)";
  setTimeout(function () {
    top.classList.remove("leaving");
    order.push(order.shift());
    layout();
    setTimeout(function () { busy = false; }, 450);
  }, 300);
}

stack.addEventListener("click", next);
stack.addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); }
});
layout();
</script>
</body>
</html>
