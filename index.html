<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanushka + Rachit</title>
<style>
html, body {
  height: 100%; margin: 0; overflow: hidden;
  /* Tiny lotus-scallop motifs; change the 96px 58px size to scale them up or down. */
  background: #ecdcae url(images/bg-pattern.webp) 0 0 / 96px 58px repeat;
}
.stack {
  position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(1080px, 100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px), (100dvh - 48px - env(safe-area-inset-top, 0px) - 16px) * 9 / 16); aspect-ratio: 9 / 16;
  cursor: pointer; outline: none;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
}
.stack:focus-visible { outline: 4px solid rgba(255,255,255,.8); outline-offset: -8px; }
.card {
  position: absolute; inset: 0; background: #f3e4d8 center / cover no-repeat;
  box-shadow: -10px 0 32px rgba(70, 40, 10, .35);
  transition: transform .45s cubic-bezier(.3,.8,.3,1);
  will-change: transform;
}
.card.leaving { transition: transform .3s ease-out; }
.card.dragging { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .card, .card.leaving { transition-duration: .01s; }
}
</style>
</head>
<body>
<div class="stack" id="stack" role="button" tabindex="0" aria-label="Card stack. Activate to move the top card to the back."></div>

<script>
// Edit this list to change the pages, or add more (one image per card, 9:16).
// Bump this number whenever you replace the images, so phones fetch the new ones.
var IMG_VERSION = 2;
var pages = [
  "images/page-1.webp", "images/page-2.webp", "images/page-3.webp", "images/page-4.webp",
  "images/page-5.webp", "images/page-6.webp", "images/page-7.webp", "images/page-8.webp"
];

var stack = document.getElementById("stack");
var order = pages.map(function (_, i) { return i; });
var busy = false;

var els = pages.map(function (src) {
  var el = document.createElement("div");
  el.className = "card";
  el.style.backgroundImage = "url(" + src + "?v=" + IMG_VERSION + ")";
  stack.appendChild(el);
  return el;
});

function layout() {
  order.forEach(function (id, pos) {
    var el = els[id];
    el.style.zIndex = pages.length - pos;
    el.style.transform = "none";
  });
}

// dir: 1 = off to the right (default for taps), -1 = off to the left
function next(dir) {
  if (busy) return;
  dir = dir === -1 ? -1 : 1;
  busy = true;
  var top = els[order[0]];
  top.classList.remove("dragging");
  top.classList.add("leaving");
  top.style.transform = "translateX(" + (dir * 110) + "%) rotate(" + (dir * 6) + "deg)";
  setTimeout(function () {
    top.classList.remove("leaving");
    order.push(order.shift());
    layout();
    setTimeout(function () { busy = false; }, 450);
  }, 300);
}

// Tap or click = next card; drag/swipe left or right = fling the top card away.
var dragging = false, moved = false, startX = 0, startT = 0, dx = 0;

stack.addEventListener("pointerdown", function (e) {
  if (busy || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
  dragging = true; moved = false; dx = 0;
  startX = e.clientX; startT = Date.now();
  try { stack.setPointerCapture(e.pointerId); } catch (err) {}
});

stack.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  dx = e.clientX - startX;
  var top = els[order[0]];
  if (!moved && Math.abs(dx) > 8) { moved = true; top.classList.add("dragging"); }
  if (moved) {
    top.style.transform = "translateX(" + dx + "px) rotate(" + (dx / stack.offsetWidth * 12) + "deg)";
  }
});

function endDrag(e, cancelled) {
  if (!dragging) return;
  dragging = false;
  var top = els[order[0]];
  if (!moved) { if (!cancelled) next(1); return; }
  top.classList.remove("dragging");
  var elapsed = Math.max(Date.now() - startT, 1);
  var fast = Math.abs(dx) / elapsed > 0.5;
  if (!cancelled && (Math.abs(dx) > stack.offsetWidth * 0.25 || fast)) {
    next(dx < 0 ? -1 : 1);
  } else {
    top.style.transform = "none"; // snap back
  }
}
stack.addEventListener("pointerup", function (e) { endDrag(e, false); });
stack.addEventListener("pointercancel", function (e) { endDrag(e, true); });

stack.addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(1); }
});
layout();
</script>
</body>
</html>
