<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanushka + Rachit</title>
<style>
html, body {
  height: 100%; margin: 0; overflow: hidden;
  /* Tiny lotus-scallop motifs; change the 44px 24px size (keep the 11:6 ratio) to scale them. */
  background: #f3e9d2 url(images/bg-motif.webp) 0 0 / 44px 24px repeat;
}
.stage {
  position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(1080px, 100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px), (100dvh - 48px - env(safe-area-inset-top, 0px) - 52px - env(safe-area-inset-bottom, 0px)) * 9 / 16);
  aspect-ratio: 9 / 16;
}
.stack {
  position: absolute; inset: 0; cursor: grab; outline: none;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
}
.stack:active { cursor: grabbing; }
.stack.zoomed { clip-path: inset(0); cursor: move; }
.stack:focus-visible { outline: 4px solid rgba(255,255,255,.8); outline-offset: -8px; }
.card {
  position: absolute; inset: 0; background: #f3e4d8 center / cover no-repeat;
  box-shadow: 10px 0 32px rgba(70, 40, 10, .35);
  transition: transform .4s cubic-bezier(.3,.8,.3,1);
  will-change: transform;
}
.card.dragging { transition: none; }

/* Carousel dots under the card */
.dots {
  position: absolute; top: calc(100% + 14px); left: 50%; transform: translateX(-50%);
  display: flex; gap: 7px; align-items: center; padding: 6px 10px; border-radius: 999px;
  background: #fbefd5; border: 1px solid rgba(122, 31, 31, .25); box-shadow: 0 2px 8px rgba(70, 40, 10, .3);
  pointer-events: none;
}
.dots i {
  display: block; width: 7px; height: 7px; border-radius: 50%;
  background: rgba(122, 31, 31, .38);
  transition: background .25s, transform .25s;
}
.dots i.on { background: #7a1f1f; transform: scale(1.3); }

/* Three-dot options menu, sits in the gap above the card's top-right corner. */
.menu-btn {
  position: absolute; top: -44px; right: 0; z-index: 300;
  width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
  border: 1px solid rgba(122, 31, 31, .35); border-radius: 50%;
  background: #fbefd5; color: #7a1f1f; cursor: pointer;
  box-shadow: 0 2px 8px rgba(70, 40, 10, .3);
  -webkit-tap-highlight-color: transparent;
}
.menu-btn svg { width: 20px; height: 20px; fill: currentColor; }
.menu-btn:focus-visible, .menu a:focus-visible { outline: 3px solid #7a1f1f; outline-offset: 2px; }
.menu {
  position: absolute; top: 2px; right: 0; z-index: 400; min-width: 230px; max-width: 100%;
  margin: 0; padding: 6px; list-style: none; box-sizing: border-box;
  background: #fbefd5; border: 1px solid #c9a35c; border-radius: 14px;
  box-shadow: 0 12px 32px rgba(40, 20, 5, .4);
  font: 600 16px/1.2 Georgia, "Times New Roman", serif;
}
.menu[hidden] { display: none; }
.menu a { display: block; padding: 13px 14px; border-radius: 9px; color: #6b1a1a; text-decoration: none; }
.menu a:hover, .menu a:focus-visible { background: #f1dcae; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .card { transition-duration: .01s; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stack" id="stack" role="group" tabindex="0"
       aria-label="Invitation pages. Swipe left or tap for the next page, swipe right for the previous page. Pinch to zoom in. With a keyboard, use the left and right arrow keys, plus and minus to zoom."></div>

  <button class="menu-btn" id="menuBtn" type="button" aria-label="More options"
          aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>
  </button>
  <ul class="menu" id="menu" role="menu" hidden></ul>
  <div class="dots" id="dots" aria-hidden="true"></div>
</div>
<div class="sr-only" id="status" aria-live="polite"></div>

<script>
/* ---------- Things you may want to edit ---------- */

// Event details used by the three-dot menu.
// managerPhone: digits only, with country code. Used for RSVP and Contact (both open WhatsApp).
var EVENT = {
  couple: "Tanushka & Rachit",
  address: "Mishtten Vilas, near Kolana Airport, Jhalawar, Semli Patpariya, Rajasthan 326001",
  managerPhone: "919782770006"
};

// Bump this number whenever you replace the images, so phones fetch the new ones.
var IMG_VERSION = 6;

// The pages, in order (one 9:16 image each).
var pages = [
  "images/page-1.webp", "images/page-2.webp", "images/page-3.webp", "images/page-4.webp",
  "images/page-5.webp", "images/page-6.webp", "images/page-7.webp", "images/page-8.webp"
];

/* ---------- Pages: one straight sequence, no looping ---------- */

var stack = document.getElementById("stack");
var statusEl = document.getElementById("status");
var n = pages.length;
var cur = 0;            // index of the page currently on top
var z = { s: 1, x: 0, y: 0 };   // zoom state (see the pinch-to-zoom section)
var busy = false;
var OFF = 1.4;                                   // how far (in card widths) seen pages wait to the left
var GONE = "translateX(" + (-OFF * 100) + "%) rotate(-6deg)";

var els = pages.map(function (src) {
  var el = document.createElement("div");
  el.className = "card";
  el.style.backgroundImage = "url(" + src + "?v=" + IMG_VERSION + ")";
  stack.appendChild(el);
  return el;
});

// Pages before `cur` wait off-screen to the left; `cur` and later are stacked in order.
function layout() {
  els.forEach(function (el, i) {
    if (i < cur) { el.style.zIndex = 100 + i; el.style.transform = GONE; }
    else         { el.style.zIndex = n - i;   el.style.transform = "none"; }
  });
  if (z.s > 1.001) applyZoom();
}

// dir: 1 = next page (swipe left or tap), -1 = previous page (swipe right)
function go(dir) {
  var target = cur + dir;
  if (busy || target < 0 || target >= n) { layout(); return false; }
  busy = true;
  resetZoom(true);
  cur = target;
  layout();
  statusEl.textContent = "Page " + (cur + 1) + " of " + n;
  updateDots();
  setTimeout(function () { busy = false; }, 400);
  return true;
}

/* ---------- Pinch to zoom (and drag to pan while zoomed) ---------- */

var MAX_ZOOM = 4;
var hiLoaded = {};                  // pages whose sharper zoom image is already swapped in

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function clampZoom() {
  var W = stack.offsetWidth, H = stack.offsetHeight;
  z.s = clamp(z.s, 1, MAX_ZOOM);
  z.x = clamp(z.x, W * (1 - z.s), 0);
  z.y = clamp(z.y, H * (1 - z.s), 0);
}

function applyZoom() {
  var el = els[cur];
  if (z.s <= 1.001) { el.style.transform = "none"; return; }
  el.style.transformOrigin = "0 0";
  el.style.transform = "translate(" + z.x + "px," + z.y + "px) scale(" + z.s + ")";
}

// Swap in the larger image the first time a page is zoomed, so text stays sharp.
function loadSharp(i) {
  if (hiLoaded[i]) return;
  hiLoaded[i] = true;
  var url = pages[i].replace("images/", "images/hi/") + "?v=" + IMG_VERSION;
  var img = new Image();
  img.onload = function () { els[i].style.backgroundImage = "url(" + url + ")"; };
  img.src = url;
}

function resetZoom(instant) {
  var el = els[cur];
  var wasZoomed = z.s > 1.001;
  z.s = 1; z.x = 0; z.y = 0;
  stack.classList.remove("zoomed");
  if (!wasZoomed) return;
  if (instant) {
    el.classList.add("dragging"); el.style.transform = "none"; void el.offsetWidth; el.classList.remove("dragging");
  } else {
    el.classList.remove("dragging"); el.style.transform = "none";
  }
  el.style.transformOrigin = "";
}

// Zoom to scale `ns`, keeping the point (cx, cy) (stack-relative px) fixed under the fingers.
function zoomAt(ns, cx, cy) {
  ns = clamp(ns, 1, MAX_ZOOM);
  var k = ns / z.s;
  z.x = cx - (cx - z.x) * k;
  z.y = cy - (cy - z.y) * k;
  z.s = ns;
  clampZoom();
  if (z.s > 1.001) { stack.classList.add("zoomed"); loadSharp(cur); }
  applyZoom();
}

/* ---------- Pointers: swipe pages, or pinch / pan ---------- */

var drag = null;                    // one-finger gesture in progress
var ptrs = {};                      // active pointers: id -> {x, y}
var pinch = null;                   // two-finger gesture in progress
var ignoreUntilUp = false;          // after a pinch, ignore the leftover finger until it lifts

function ptrList() { return Object.keys(ptrs).map(function (k) { return ptrs[k]; }); }
function localXY(p) { var r = stack.getBoundingClientRect(); return { x: p.x - r.left, y: p.y - r.top }; }

function startPinch() {
  var p = ptrList(), a = localXY(p[0]), b = localXY(p[1]);
  if (drag) {                                    // abandon any half-finished swipe
    if (drag.card) drag.card.classList.remove("dragging");
    drag = null; layout(); applyZoom();
  }
  pinch = {
    d0: Math.max(Math.hypot(a.x - b.x, a.y - b.y), 1),
    s0: z.s,
    // the point of the page under the fingers' midpoint, in unscaled page coordinates
    ux: ((a.x + b.x) / 2 - z.x) / z.s,
    uy: ((a.y + b.y) / 2 - z.y) / z.s
  };
  els[cur].classList.add("dragging");
}

stack.addEventListener("pointerdown", function (e) {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (menuOpen) { closeMenu(); return; }          // a tap outside just closes the menu
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
  try { stack.setPointerCapture(e.pointerId); } catch (err) {}
  var count = Object.keys(ptrs).length;
  if (count >= 2) { if (!pinch) startPinch(); return; }
  if (busy || ignoreUntilUp) return;
  drag = { x: e.clientX, y: e.clientY, t: Date.now(), dx: 0, moved: false, card: null, mode: 0,
           zx: z.x, zy: z.y, zoomed: z.s > 1.001 };
});

stack.addEventListener("pointermove", function (e) {
  if (!ptrs[e.pointerId]) return;
  ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };

  if (pinch) {
    var p = ptrList(), a = localXY(p[0]), b = localXY(p[1]);
    var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    var ns = clamp(pinch.s0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d0, 1, MAX_ZOOM);
    z.s = ns;
    z.x = cx - pinch.ux * ns;                    // keeps the same page point under the fingers (also pans)
    z.y = cy - pinch.uy * ns;
    clampZoom();
    if (z.s > 1.001) { stack.classList.add("zoomed"); loadSharp(cur); }
    applyZoom();
    return;
  }
  if (!drag) return;

  if (drag.zoomed) {                             // one finger while zoomed: pan the page
    var mx = e.clientX - drag.x, my = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(mx, my) < 8) return;
    if (!drag.moved) { drag.moved = true; els[cur].classList.add("dragging"); }
    z.x = drag.zx + mx; z.y = drag.zy + my;
    clampZoom(); applyZoom();
    return;
  }

  drag.dx = e.clientX - drag.x;
  if (!drag.moved) {
    if (Math.abs(drag.dx) < 8) return;
    drag.moved = true;
    // Swipe left -> next page (not on the last page). Swipe right -> previous page (not on the first).
    if (drag.dx < 0 && cur < n - 1)      { drag.mode = 1;  drag.card = els[cur]; }
    else if (drag.dx > 0 && cur > 0)     { drag.mode = -1; drag.card = els[cur - 1]; }
    if (drag.card) drag.card.classList.add("dragging");
  }
  if (!drag.card) return;
  var W = stack.offsetWidth, x;
  if (drag.mode === 1) {                        // top page follows the finger off to the left
    x = Math.min(drag.dx, 0);
    drag.card.style.transform = "translateX(" + x + "px) rotate(" + (x / W * 12) + "deg)";
  } else {                                      // previous page slides back in from the left
    x = Math.min(0, -W + Math.max(drag.dx, 0));
    drag.card.style.transform = "translateX(" + x + "px) rotate(" + (6 * x / W) + "deg)";
  }
});

function endDrag(cancelled) {
  if (!drag) return;
  var d = drag; drag = null;
  if (d.zoomed) {
    els[cur].classList.remove("dragging");
    if (!d.moved && !cancelled) resetZoom(false);     // tap while zoomed = zoom back out
    return;
  }
  if (d.card) d.card.classList.remove("dragging");
  if (!d.moved) { if (!cancelled) go(1); return; }   // a tap goes to the next page
  if (!d.card) return;                                // swiped the way that isn't allowed here
  var W = stack.offsetWidth;
  var fast = Math.abs(d.dx) / Math.max(Date.now() - d.t, 1) > 0.5;
  var far = Math.abs(d.dx) > W * 0.25 || fast;
  var rightWay = d.mode === 1 ? d.dx < 0 : d.dx > 0;
  if (!cancelled && far && rightWay) go(d.mode); else layout();   // otherwise snap back
}

function onPointerEnd(e, cancelled) {
  if (!ptrs[e.pointerId]) return;
  delete ptrs[e.pointerId];
  var left = Object.keys(ptrs).length;
  if (pinch) {
    if (left < 2) {
      pinch = null;
      els[cur].classList.remove("dragging");
      if (z.s < 1.05) resetZoom(false);          // pinched back out: settle at normal size
      ignoreUntilUp = left > 0;                  // the remaining finger shouldn't start a swipe or tap
    }
    return;
  }
  if (left === 0) ignoreUntilUp = false;
  endDrag(cancelled);
}
stack.addEventListener("pointerup", function (e) { onPointerEnd(e, false); });
stack.addEventListener("pointercancel", function (e) { onPointerEnd(e, true); });

// Desktop: scroll wheel / trackpad pinch (which arrives as ctrl+wheel) zooms at the cursor.
stack.addEventListener("wheel", function (e) {
  e.preventDefault();
  var r = stack.getBoundingClientRect();
  var factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025));
  zoomAt(z.s * factor, e.clientX - r.left, e.clientY - r.top);
  if (z.s < 1.02) resetZoom(false);
}, { passive: false });

// Stop iOS Safari from zooming the whole page when pinching the card.
["gesturestart", "gesturechange"].forEach(function (t) {
  stack.addEventListener(t, function (e) { e.preventDefault(); });
});

stack.addEventListener("keydown", function (e) {
  var W = stack.offsetWidth, H = stack.offsetHeight;
  if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomAt(z.s * 1.5, W / 2, H / 2); }
  else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomAt(z.s / 1.5, W / 2, H / 2); if (z.s < 1.02) resetZoom(false); }
  else if (e.key === "0" || e.key === "Escape") { if (z.s > 1.001) { e.preventDefault(); resetZoom(false); } }
  else if (z.s > 1.001 && e.key.indexOf("Arrow") === 0) {      // pan the zoomed page
    e.preventDefault();
    var step = 60;
    if (e.key === "ArrowLeft") z.x += step; else if (e.key === "ArrowRight") z.x -= step;
    else if (e.key === "ArrowUp") z.y += step; else z.y -= step;
    clampZoom(); applyZoom();
  }
  else if (e.key === "ArrowLeft" || e.key === "Enter" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); go(-1); }
});

/* ---------- Carousel dots ---------- */
var dotsEl = document.getElementById("dots");
var dotEls = pages.map(function () { var d = document.createElement("i"); dotsEl.appendChild(d); return d; });
function updateDots() { dotEls.forEach(function (d, i) { d.className = i === cur ? "on" : ""; }); }

layout();
updateDots();

/* ---------- Three-dot menu ---------- */

var menuBtn = document.getElementById("menuBtn");
var menu = document.getElementById("menu");
var menuOpen = false;

(function buildMenu() {
  var addr = encodeURIComponent(EVENT.address);
  var phone = String(EVENT.managerPhone || "").replace(/\D/g, "");
  var items = [];
  if (phone) {
    var msg = "Hello! I'd like to RSVP for " + EVENT.couple + "'s wedding celebrations.\n\n" +
              "Name:\nNumber of guests:\nEvents attending:";
    items.push(["RSVP", "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), true]);
    items.push(["Contact event manager", "https://wa.me/" + phone, true]);
  }
  items.push(["Location", "https://www.google.com/maps/search/?api=1&query=" + addr, true]);
  items.push(["Get directions", "https://www.google.com/maps/dir/?api=1&destination=" + addr, true]);

  items.forEach(function (it) {
    var li = document.createElement("li");
    li.setAttribute("role", "none");
    var a = document.createElement("a");
    a.setAttribute("role", "menuitem");
    a.textContent = it[0];
    a.href = it[1];
    if (it[2]) { a.target = "_blank"; a.rel = "noopener"; }
    li.appendChild(a);
    menu.appendChild(li);
  });
})();

function openMenu() {
  menu.hidden = false; menuOpen = true;
  menuBtn.setAttribute("aria-expanded", "true");
  var first = menu.querySelector("a"); if (first) first.focus();
}
function closeMenu(returnFocus) {
  menu.hidden = true; menuOpen = false;
  menuBtn.setAttribute("aria-expanded", "false");
  if (returnFocus === true) menuBtn.focus();
}
menuBtn.addEventListener("click", function () { menuOpen ? closeMenu() : openMenu(); });
menu.addEventListener("click", function () { closeMenu(); });
document.addEventListener("pointerdown", function (e) {
  if (menuOpen && !menu.contains(e.target) && !menuBtn.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && menuOpen) closeMenu(true);
});
</script>
</body>
</html>
