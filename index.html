<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tanushka + Rachit</title>
<style>
html, body {
  height: 100%; margin: 0; overflow: hidden;
  /* Tiny lotus-scallop motifs; change the 96px 58px size to scale them up or down. */
  background: #ecdcae url(images/bg-pattern.webp) 0 0 / 96px 58px repeat;
}
.stage {
  position: absolute; top: calc(48px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(1080px, 100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px), (100dvh - 48px - env(safe-area-inset-top, 0px) - 16px) * 9 / 16);
  aspect-ratio: 9 / 16;
}
.stack {
  position: absolute; inset: 0; cursor: grab; outline: none;
  -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none;
}
.stack:active { cursor: grabbing; }
.stack:focus-visible { outline: 4px solid rgba(255,255,255,.8); outline-offset: -8px; }
.card {
  position: absolute; inset: 0; background: #f3e4d8 center / cover no-repeat;
  box-shadow: -10px 0 32px rgba(70, 40, 10, .35);
  transition: transform .4s cubic-bezier(.3,.8,.3,1);
  will-change: transform;
}
.card.dragging { transition: none; }

/* Three-dot options menu, sits in the gap above the card's top-right corner. */
.menu-btn {
  position: absolute; top: -44px; right: 0; z-index: 300;
  width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
  border: 1px solid rgba(122, 31, 31, .35); border-radius: 50%;
  background: #fbefd5; color: #7a1f1f; cursor: pointer;
  box-shadow: 0 2px 8px rgba(70, 40, 10, .3);
  -webkit-tap-highlight-color: transparent;
}
.menu-btn svg { width: 20px; height: 20px; fill: currentColor; }
.menu-btn:focus-visible, .menu a:focus-visible { outline: 3px solid #7a1f1f; outline-offset: 2px; }
.menu {
  position: absolute; top: 2px; right: 0; z-index: 400; min-width: 230px; max-width: 100%;
  margin: 0; padding: 6px; list-style: none; box-sizing: border-box;
  background: #fbefd5; border: 1px solid #c9a35c; border-radius: 14px;
  box-shadow: 0 12px 32px rgba(40, 20, 5, .4);
  font: 600 16px/1.2 Georgia, "Times New Roman", serif;
}
.menu[hidden] { display: none; }
.menu a { display: block; padding: 13px 14px; border-radius: 9px; color: #6b1a1a; text-decoration: none; }
.menu a:hover, .menu a:focus-visible { background: #f1dcae; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  .card { transition-duration: .01s; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stack" id="stack" role="group" tabindex="0"
       aria-label="Invitation pages. Swipe right or tap for the next page, swipe left for the previous page. With a keyboard, use the right and left arrow keys."></div>

  <button class="menu-btn" id="menuBtn" type="button" aria-label="More options"
          aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>
  </button>
  <ul class="menu" id="menu" role="menu" hidden></ul>
</div>
<div class="sr-only" id="status" aria-live="polite"></div>

<script>
/* ---------- Things you may want to edit ---------- */

// Event details used by the three-dot menu.
// RSVP and "Contact event manager" appear once managerPhone is filled in
// (digits only, with country code, e.g. "919876543210").
var EVENT = {
  couple: "Tanushka & Rachit",
  address: "Mishtten Vilas, near Kolana Airport, Jhalawar, Semli Patpariya, Rajasthan 326001",
  managerPhone: ""
};

// Bump this number whenever you replace the images, so phones fetch the new ones.
var IMG_VERSION = 3;

// The pages, in order (one 9:16 image each).
var pages = [
  "images/page-1.webp", "images/page-2.webp", "images/page-3.webp", "images/page-4.webp",
  "images/page-5.webp", "images/page-6.webp", "images/page-7.webp", "images/page-8.webp"
];

/* ---------- Pages: one straight sequence, no looping ---------- */

var stack = document.getElementById("stack");
var statusEl = document.getElementById("status");
var n = pages.length;
var cur = 0;            // index of the page currently on top
var busy = false;
var OFF = 1.4;                                   // how far (in card widths) seen pages wait to the right
var GONE = "translateX(" + (OFF * 100) + "%) rotate(6deg)";

var els = pages.map(function (src) {
  var el = document.createElement("div");
  el.className = "card";
  el.style.backgroundImage = "url(" + src + "?v=" + IMG_VERSION + ")";
  stack.appendChild(el);
  return el;
});

// Pages before `cur` wait off-screen to the right; `cur` and later are stacked in order.
function layout() {
  els.forEach(function (el, i) {
    if (i < cur) { el.style.zIndex = 100 + i; el.style.transform = GONE; }
    else         { el.style.zIndex = n - i;   el.style.transform = "none"; }
  });
}

// dir: 1 = next page (swipe right or tap), -1 = previous page (swipe left)
function go(dir) {
  var target = cur + dir;
  if (busy || target < 0 || target >= n) { layout(); return false; }
  busy = true;
  cur = target;
  layout();
  statusEl.textContent = "Page " + (cur + 1) + " of " + n;
  setTimeout(function () { busy = false; }, 400);
  return true;
}

var drag = null;

stack.addEventListener("pointerdown", function (e) {
  if (!e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
  if (menuOpen) { closeMenu(); return; }          // a tap outside just closes the menu
  if (busy) return;
  drag = { x: e.clientX, t: Date.now(), dx: 0, moved: false, card: null, mode: 0 };
  try { stack.setPointerCapture(e.pointerId); } catch (err) {}
});

stack.addEventListener("pointermove", function (e) {
  if (!drag) return;
  drag.dx = e.clientX - drag.x;
  if (!drag.moved) {
    if (Math.abs(drag.dx) < 8) return;
    drag.moved = true;
    // Swipe right -> next page (not on the last page). Swipe left -> previous page (not on the first).
    if (drag.dx > 0 && cur < n - 1)      { drag.mode = 1;  drag.card = els[cur]; }
    else if (drag.dx < 0 && cur > 0)     { drag.mode = -1; drag.card = els[cur - 1]; }
    if (drag.card) drag.card.classList.add("dragging");
  }
  if (!drag.card) return;
  var W = stack.offsetWidth, x;
  if (drag.mode === 1) {                        // top page follows the finger to the right
    x = Math.max(drag.dx, 0);
    drag.card.style.transform = "translateX(" + x + "px) rotate(" + (x / W * 12) + "deg)";
  } else {                                      // previous page slides back in from the right
    var start = W;   // enters from the right edge, tracking the finger
    x = Math.max(0, start + Math.min(drag.dx, 0));
    drag.card.style.transform = "translateX(" + x + "px) rotate(" + (6 * x / start) + "deg)";
  }
});

function endDrag(cancelled) {
  if (!drag) return;
  var d = drag; drag = null;
  if (d.card) d.card.classList.remove("dragging");
  if (!d.moved) { if (!cancelled) go(1); return; }   // a tap goes to the next page
  if (!d.card) return;                                // swiped the way that isn't allowed here
  var W = stack.offsetWidth;
  var fast = Math.abs(d.dx) / Math.max(Date.now() - d.t, 1) > 0.5;
  var far = Math.abs(d.dx) > W * 0.25 || fast;
  var rightWay = d.mode === 1 ? d.dx > 0 : d.dx < 0;
  if (!cancelled && far && rightWay) go(d.mode); else layout();   // otherwise snap back
}
stack.addEventListener("pointerup", function () { endDrag(false); });
stack.addEventListener("pointercancel", function () { endDrag(true); });

stack.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === "Enter" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
});

layout();

/* ---------- Three-dot menu ---------- */

var menuBtn = document.getElementById("menuBtn");
var menu = document.getElementById("menu");
var menuOpen = false;

(function buildMenu() {
  var addr = encodeURIComponent(EVENT.address);
  var phone = String(EVENT.managerPhone || "").replace(/\D/g, "");
  var items = [];
  if (phone) {
    var msg = "Hello! I'd like to RSVP for " + EVENT.couple + "'s wedding celebrations.\n\n" +
              "Name:\nNumber of guests:\nEvents attending:";
    items.push(["RSVP", "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg), true]);
    items.push(["Contact event manager", "tel:+" + phone, false]);
  }
  items.push(["Location", "https://www.google.com/maps/search/?api=1&query=" + addr, true]);
  items.push(["Get directions", "https://www.google.com/maps/dir/?api=1&destination=" + addr, true]);

  items.forEach(function (it) {
    var li = document.createElement("li");
    li.setAttribute("role", "none");
    var a = document.createElement("a");
    a.setAttribute("role", "menuitem");
    a.textContent = it[0];
    a.href = it[1];
    if (it[2]) { a.target = "_blank"; a.rel = "noopener"; }
    li.appendChild(a);
    menu.appendChild(li);
  });
})();

function openMenu() {
  menu.hidden = false; menuOpen = true;
  menuBtn.setAttribute("aria-expanded", "true");
  var first = menu.querySelector("a"); if (first) first.focus();
}
function closeMenu(returnFocus) {
  menu.hidden = true; menuOpen = false;
  menuBtn.setAttribute("aria-expanded", "false");
  if (returnFocus === true) menuBtn.focus();
}
menuBtn.addEventListener("click", function () { menuOpen ? closeMenu() : openMenu(); });
menu.addEventListener("click", function () { closeMenu(); });
document.addEventListener("pointerdown", function (e) {
  if (menuOpen && !menu.contains(e.target) && !menuBtn.contains(e.target)) closeMenu();
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && menuOpen) closeMenu(true);
});
</script>
</body>
</html>
